<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Educativo - ¿Qué pasa en Urrá?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #121212;
            --bg-card: #1a1a1a;
            --text-primary: #fafafa;
            --text-secondary: #a8a8a8;
            --accent-blue: #0095f6;
            --accent-red: #ed4956;
            --border-color: #262626;
            --story-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        * {
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: #363636; border-radius: 10px; }

        .story-ring {
            background: var(--story-gradient);
            padding: 3px;
            border-radius: 50%;
        }
        .story-ring-inner {
            background: var(--bg-primary);
            padding: 2px;
            border-radius: 50%;
        }
        .story-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
        }
        .stories-container {
            overflow-x: auto;
            scrollbar-width: none;
        }
        .stories-container::-webkit-scrollbar { display: none; }

        /* Video container */
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 9/16;
            max-height: 75vh;
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
        }

        /* Cropper para ocultar bordes de YouTube */
        .video-cropper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .video-cropper iframe {
            position: absolute;
            top: -10%;
            left: 0;
            width: 100%;
            height: 120%;
            border: none;
        }

        /* Thumbnail clickeable */
        .video-thumbnail {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 5;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .video-thumbnail.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Play button */
        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(0,0,0,0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 15;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .play-button:hover {
            background: rgba(0,0,0,0.85);
            transform: translate(-50%, -50%) scale(1.1);
        }
        .play-button svg {
            width: 40px;
            height: 40px;
            fill: white;
            margin-left: 5px;
        }
        .play-button.hidden {
            display: none;
        }

        /* Corazones animados */
        .heart {
            position: absolute;
            pointer-events: none;
            animation: floatHeart 1.2s ease-out forwards;
            z-index: 100;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.4));
        }

        @keyframes floatHeart {
            0% {
                opacity: 1;
                transform: scale(0) rotate(0deg);
            }
            30% {
                opacity: 1;
                transform: scale(1.4) rotate(-10deg);
            }
            100% {
                opacity: 0;
                transform: scale(1) translateY(-200px) rotate(15deg);
            }
        }

        /* Botones laterales estilo Reels */
        .side-actions {
            position: absolute;
            right: 12px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 20;
        }
        .side-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .side-btn span {
            font-size: 12px;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .action-btn {
            transition: transform 0.2s ease;
        }
        .action-btn:active {
            transform: scale(0.85);
        }
        .action-btn.liked svg {
            fill: var(--accent-red);
            animation: likePopup 0.4s ease;
        }
        @keyframes likePopup {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* LIVE Badge */
        .live-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #ed4956;
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 5px;
            animation: pulse-live 2s infinite;
        }
        .live-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
        }
        @keyframes pulse-live {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Live Comments Overlay */
        .live-comments-overlay {
            position: absolute;
            bottom: 80px;
            left: 12px;
            right: 60px;
            max-height: 200px;
            overflow: hidden;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            pointer-events: none;
        }
        .live-comment-item {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 6px 10px;
            border-radius: 16px;
            margin-bottom: 6px;
            font-size: 13px;
            color: white;
            animation: slideUpComment 0.4s ease;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .live-comment-item .username {
            font-weight: 600;
            color: #0095f6;
        }
        @keyframes slideUpComment {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Viewer count */
        .viewer-count {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Buscador */
        .search-bar {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-bar:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(0, 149, 246, 0.1);
        }
        .search-bar input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            flex: 1;
            font-size: 14px;
        }
        .search-bar input:focus { outline: none; }

        /* Navigation */
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 12px 0;
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.2s;
            position: relative;
        }
        .nav-item.active { color: var(--text-primary); }
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 1px;
            background: var(--text-primary);
        }

        /* Post card */
        .post-card {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }

        /* Comment Input Area */
        .comment-input-area {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-primary);
        }
        .comment-input-area input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
        }
        .comment-input-area input:focus { outline: none; }
        .comment-input-area input::placeholder { color: var(--text-secondary); }
        .comment-input-area button {
            background: none;
            border: none;
            color: var(--accent-blue);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .comment-input-area button:hover { opacity: 0.7; }

        /* Comments Section */
        .comments-section {
            padding: 12px 16px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }
        .comments-section.open { display: block; }
        
        .comment-item {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .comment-item .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .comment-item .content {
            flex: 1;
        }
        .comment-item .username {
            font-weight: 600;
            font-size: 13px;
            margin-right: 6px;
        }
        .comment-item .text {
            font-size: 13px;
            color: var(--text-primary);
        }
        .comment-item .time {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Animaciones de entrada */
        .fade-in-up {
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }

        @media (max-width: 640px) {
            .story-avatar { width: 48px; height: 48px; }
            .video-container { max-height: 65vh; }
        }

        @media (prefers-reduced-motion: reduce) {
            .heart, .fade-in-up, .live-comment-item { animation: none; opacity: 1; }
        }
    </style>
</head>

        // Live intervals storage

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function renderStories() {
            const container = document.getElementById('stories-list');
            container.innerHTML = accounts.map((account, index) => `
                <div class="flex flex-col items-center gap-1 fade-in-up stagger-${index + 1}" style="cursor: pointer;">

        }

        function createHearts(container, x, y) {
            const heartSymbols = ['❤️', '💗', '💖', '💕', '💝', '❤️‍🔥'];
            
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                    heart.style.left = (x + (Math.random() - 0.5) * 140) + 'px';
                    heart.style.top = (y + (Math.random() - 0.5) * 80) + 'px';
                    heart.style.fontSize = (30 + Math.random() * 40) + 'px';
                    container.appendChild(heart);
                    
                    setTimeout(() => heart.remove(), 1200);
                }, i * 50);
            }
        }

        function toggleLike(postId, button) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            
            post.liked = !post.liked;
            post.likes += post.liked ? 1 : -1;
            
            document.querySelectorAll(`#post-${postId} .like-btn`).forEach(btn => {
                btn.classList.toggle('liked', post.liked);
                const svg = btn.querySelector('svg');
                if (svg) {
                    svg.setAttribute('fill', post.liked ? '#ed4956' : 'none');
                    svg.setAttribute('stroke', post.liked ? '#ed4956' : 'white');
                }
            });
            
            const likesSpan = document.querySelector(`#post-${postId} .likes-count`);
            if (likesSpan) {
                likesSpan.textContent = formatNumber(post.likes) + ' Me gusta';
            }
        }

        function toggleSave(postId, button) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            
            post.saved = !post.saved;
            button.classList.toggle('saved', post.saved);
            
            const svg = button.querySelector('svg');
            if (svg) {
                svg.setAttribute('fill', post.saved ? 'white' : 'none');
            }
        }

        function toggleVideo(postId) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            
            const thumbnail = document.getElementById(`thumbnail-${postId}`);
            const playBtn = document.getElementById(`play-btn-${postId}`);
            const iframe = document.querySelector(`#video-container-${postId} iframe`);
            
            post.isPlaying = !post.isPlaying;
            
            if (post.isPlaying) {
                thumbnail.classList.add('hidden');
                playBtn.classList.add('hidden');
                
                // Cambiar src del iframe para activar autoplay
                if (iframe) {
                    const currentSrc = iframe.src;
                    if (!currentSrc.includes('autoplay=1')) {
                        iframe.src = currentSrc.replace('autoplay=0', 'autoplay=1');
                    }
                }
                
                // Iniciar LIVE comments si es el primer video
                if (post.isLive && !liveIntervals[postId]) {
                    startLiveComments(postId);
                }
            } else {
                thumbnail.classList.remove('hidden');
                playBtn.classList.remove('hidden');
                
                // Pausar video
                if (iframe) {
                    iframe.src = iframe.src.replace('autoplay=1', 'autoplay=0');
                }
            }
        }

        function startLiveComments(postId) {
            const container = document.getElementById(`live-comments-${postId}`);
            if (!container) return;
            
            let commentIndex = 0;
            
            const addLiveComment = () => {
                if (commentIndex >= liveCommentsData.length) {
                    commentIndex = 0;
                }
                
                const comment = liveCommentsData[commentIndex];
                const commentEl = document.createElement('div');
                commentEl.className = 'live-comment-item';
                commentEl.innerHTML = `<span class="username">${comment.user}</span> ${comment.text}`;
                
                container.insertBefore(commentEl, container.firstChild);
                
                while (container.children.length > 10) {
                    container.removeChild(container.lastChild);
                }
                
                const post = posts.find(p => p.id === postId);
                if (post) {
                    post.liveViewerCount += Math.floor(Math.random() * 10) - 3;
                    const viewerEl = document.getElementById(`viewer-count-${postId}`);
                    if (viewerEl) {
                        viewerEl.innerHTML = `<svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg> ${formatNumber(post.liveViewerCount)}`;
                    }
                }
                
                commentIndex++;
            };
            
            addLiveComment();
            liveIntervals[postId] = setInterval(addLiveComment, 10000);
        }

        function toggleComments(postId) {
            const section = document.getElementById(`comments-section-${postId}`);
            if (section) {
                section.classList.toggle('open');
            }
        }

        function addComment(postId, input) {
            const text = input.value.trim();
            if (!text) return;
            
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            
            const newComment = {
                user: 'tu_usuario',
                text: text,
                time: 'Ahora'
            };
            
            post.comments.unshift(newComment);
            
            const container = document.getElementById(`comments-list-${postId}`);
            if (container) {
                const commentHTML = `
                    <div class="comment-item">
                        <div class="avatar bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-white text-xs font-bold rounded-full">T</div>
                        <div class="content">
                            <span class="username">${newComment.user}</span>
                            <span class="text">${newComment.text}</span>
                            <div class="time">${newComment.time}</div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('afterbegin', commentHTML);
            }
            
            input.value = '';
            
            const countEl = document.querySelector(`#post-${postId} .comment-count`);
            if (countEl) {
                countEl.textContent = post.comments.length;
            }
        }

        function renderPosts() {
            const container = document.getElementById('posts-feed');
            container.innerHTML = posts.map((post, index) => `
                <article id="post-${post.id}" class="post-card fade-in-up stagger-${index + 1}">
                    <!-- Header -->
                    <div class="flex items-center justify-between p-3">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-br ${post.account.gradient} flex items-center justify-center text-white font-bold text-sm">
                                ${post.account.avatar}
                            </div>
                            <div class="flex items-center gap-1">
                                <span class="font-semibold text-sm">${post.account.username}</span>
                                ${post.account.verified ? `
                                    <svg width="14" height="14" fill="#0095f6" viewBox="0 0 24 24">
                                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                    </svg>
                                ` : ''}
                            </div>
                        </div>
                        <button class="p-2 hover:bg-[#262626] rounded-full transition-colors" aria-label="Más opciones">
                            <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                                <circle cx="12" cy="5" r="2"/>
                                <circle cx="12" cy="12" r="2"/>
                                <circle cx="12" cy="19" r="2"/>
                            </svg>
                        </button>
                    </div>
                    
                    <!-- Video Container -->
                    <div class="video-container mx-3" id="video-container-${post.id}">
                        <!-- Cropper con iframe -->
                        <div class="video-cropper">
                            <iframe 
                                src="https://www.youtube.com/embed/${post.videoId}?autoplay=0&controls=1&modestbranding=1&rel=0&showinfo=0&loop=1&playlist=${post.videoId}" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen
                                loading="lazy"
                            ></iframe>
                        </div>
                        
                        <!-- Thumbnail clickeable -->
                        <img 
                            class="video-thumbnail" 
                            src="https://img.youtube.com/vi/${post.videoId}/maxresdefault.jpg"
                            alt="Video thumbnail"
                            id="thumbnail-${post.id}"
                            onerror="this.src='https://img.youtube.com/vi/${post.videoId}/hqdefault.jpg'"
                            onclick="toggleVideo(${post.id})"
                        >
                        
                        <!-- Play Button -->
                        <div class="play-button" id="play-btn-${post.id}" onclick="toggleVideo(${post.id})">
                            <svg viewBox="0 0 24 24">
                                <polygon points="5,3 19,12 5,21"/>
                            </svg>
                        </div>
                        
                        ${post.isLive ? `
                            <!-- LIVE Badge -->
                            <div class="live-badge">EN VIVO</div>
                            
                            <!-- Viewer Count -->
                            <div class="viewer-count" id="viewer-count-${post.id}">
                                <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                                ${formatNumber(post.liveViewerCount)}
                            </div>
                            
                            <!-- Live Comments Overlay -->
                            <div class="live-comments-overlay" id="live-comments-${post.id}"></div>
                        ` : ''}
                        
                        <!-- Side Actions -->
                        <div class="side-actions">
                            <div class="side-btn">
                                <button class="action-btn p-3 bg-black/40 rounded-full like-btn ${post.liked ? 'liked' : ''}" onclick="toggleLike(${post.id}, this)" aria-label="Me gusta">
                                    <svg width="28" height="28" fill="${post.liked ? '#ed4956' : 'none'}" stroke="${post.liked ? '#ed4956' : 'white'}" stroke-width="2">
                                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                                    </svg>
                                </button>
                                <span>${formatNumber(post.likes)}</span>
                            </div>
                            <div class="side-btn">
                                <button class="action-btn p-3 bg-black/40 rounded-full" onclick="toggleComments(${post.id})" aria-label="Comentar">
                                    <svg width="28" height="28" fill="none" stroke="white" stroke-width="2">
                                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                                    </svg>
                                </button>
                                <span class="comment-count">${post.comments.length}</span>
                            </div>
                            <div class="side-btn">
                                <button class="action-btn p-3 bg-black/40 rounded-full" aria-label="Compartir">
                                    <svg width="28" height="28" fill="none" stroke="white" stroke-width="2">
                                        <path d="M22 2L11 13"/>
                                        <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
                                    </svg>
                                </button>
                                <span>${post.shares}</span>
                            </div>
                            <div class="side-btn">
                                <button class="action-btn p-3 bg-black/40 rounded-full save-btn ${post.saved ? 'saved' : ''}" onclick="toggleSave(${post.id}, this)" aria-label="Guardar">
                                    <svg width="28" height="28" fill="${post.saved ? 'white' : 'none'}" stroke="white" stroke-width="2">
                                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        
                        <!-- User info en bottom -->
                        <div class="absolute bottom-4 left-4 right-16 z-10 pointer-events-none">
                            <div class="flex items-center gap-2 mb-2">
                                <div class="w-7 h-7 rounded-full bg-gradient-to-br ${post.account.gradient} flex items-center justify-center text-white font-bold text-xs">
                                    ${post.account.avatar}
                                </div>
                                <span class="font-semibold text-sm text-white drop-shadow-lg">${post.account.username}</span>
                            </div>
                            <p class="text-white text-xs drop-shadow-lg">${post.description.slice(0, 60)}...</p>
                        </div>
                    </div>
                    
                    <!-- Actions below video -->
                    <div class="p-3">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-4">
                                <button class="action-btn like-btn ${post.liked ? 'liked' : ''}" onclick="toggleLike(${post.id}, this)" aria-label="Me gusta">
                                    <svg width="24" height="24" fill="${post.liked ? '#ed4956' : 'none'}" stroke="${post.liked ? '#ed4956' : 'currentColor'}" stroke-width="2">
                                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                                    </svg>
                                </button>
                                <button class="action-btn" onclick="toggleComments(${post.id})" aria-label="Comentar">
                                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                                    </svg>
                                </button>
                                <button class="action-btn" aria-label="Compartir">
                                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M22 2L11 13"/>
                                        <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
                                    </svg>
                                </button>
                            </div>
                            <button class="action-btn save-btn ${post.saved ? 'saved' : ''}" onclick="toggleSave(${post.id}, this)" aria-label="Guardar">
                                <svg width="24" height="24" fill="${post.saved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                                </svg>
                            </button>
                        </div>
                        <p class="font-semibold text-sm likes-count">${formatNumber(post.likes)} Me gusta</p>
                    </div>
                    
                    <!-- Description completa -->
                    <div class="px-3 pb-2">
                        <p class="text-sm">
                            <span class="font-semibold">${post.account.username}</span>
                            <span class="ml-1">${post.description}</span>
                        </p>
                    </div>
                    
                    <!-- Comments Section -->
                    <div class="comments-section" id="comments-section-${post.id}">
                        <div id="comments-list-${post.id}">
                            ${post.comments.map(c => `
                                <div class="comment-item">
                                    <div class="avatar bg-gradient-to-br from-gray-500 to-gray-600 flex items-center justify-center text-white text-xs font-bold rounded-full">${c.user[0].toUpperCase()}</div>
                                    <div class="content">
                                        <span class="username">${c.user}</span>
                                        <span class="text">${c.text}</span>
                                        <div class="time">${c.time}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    
                    <!-- Comment Input -->
                    <div class="comment-input-area">
                        <div class="w-7 h-7 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-white text-xs font-bold">T</div>
                        <input type="text" id="comment-input-${post.id}" placeholder="Agrega un comentario..." onkeypress="if(event.key==='Enter')addComment(${post.id}, this)">
                        <button onclick="addComment(${post.id}, document.getElementById('comment-input-${post.id}'))">Publicar</button>
                    </div>
                </article>
            `).join('');

            // Event listeners para corazones (doble click en el contenedor)
            posts.forEach(post => {
                const videoContainer = document.getElementById(`video-container-${post.id}`);
                if (videoContainer) {
                    videoContainer.addEventListener('dblclick', (e) => {
                        // No activar si es un botón
                        if (e.target.closest('button')) return;
                        
                        const rect = videoContainer.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;
                        
                        createHearts(videoContainer, x, y);
                        
                        if (!post.liked) {
                            toggleLike(post.id, document.querySelector(`#post-${post.id} .side-btn .like-btn`));
                        }
                    });
                }
            });
        }

        // Navigation tabs
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            });
        });

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            renderStories();
            renderPosts();
        });
    </script>
</body>
</html>
