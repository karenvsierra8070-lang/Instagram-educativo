<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Educativo - ¿Qué pasa en Urrá?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #121212;
            --bg-card: #1a1a1a;
            --text-primary: #fafafa;
            --text-secondary: #a8a8a8;
            --accent-blue: #0095f6;
            --accent-red: #ed4956;
            --border-color: #262626;
            --story-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        * {
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: #363636;
            border-radius: 10px;
        }

        /* Stories */
        .story-ring {
            background: var(--story-gradient);
            padding: 3px;
            border-radius: 50%;
        }

        .story-ring-inner {
            background: var(--bg-primary);
            padding: 2px;
            border-radius: 50%;
        }

        .story-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
        }

        .stories-container {
            overflow-x: auto;
            scrollbar-width: none;
        }
        .stories-container::-webkit-scrollbar {
            display: none;
        }

        /* Video container - estilo Instagram Reels */
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 9/16;
            max-height: 75vh;
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
        }

        /* Wrapper para cropear la barra de YouTube */
        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% + 60px);
            pointer-events: none;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: auto;
        }

        /* Overlay para ocultar la parte de abajo de YouTube */
        .video-overlay-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            pointer-events: none;
            z-index: 5;
        }

        /* Play button grande */
        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .play-button:hover {
            background: rgba(0,0,0,0.8);
            transform: translate(-50%, -50%) scale(1.1);
        }

        .play-button svg {
            width: 40px;
            height: 40px;
            fill: white;
            margin-left: 5px;
        }

        /* Corazones animados */
        .heart {
            position: absolute;
            pointer-events: none;
            animation: floatHeart 1s ease-out forwards;
            font-size: 60px;
            z-index: 100;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
        }

        @keyframes floatHeart {
            0% {
                opacity: 1;
                transform: scale(0) rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: scale(1.3) rotate(-15deg);
            }
            100% {
                opacity: 0;
                transform: scale(1) translateY(-180px) rotate(15deg);
            }
        }

        /* Botones de acción */
        .action-btn {
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .action-btn:active {
            transform: scale(0.85);
        }

        .action-btn.liked svg {
            fill: var(--accent-red);
            color: var(--accent-red);
            animation: likePopup 0.4s ease;
        }

        @keyframes likePopup {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }

        /* Buscador */
        .search-bar {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-bar:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(0, 149, 246, 0.1);
        }
        .search-bar input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            flex: 1;
            font-size: 14px;
        }
        .search-bar input:focus {
            outline: none;
        }

        /* Navigation */
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 12px 0;
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.2s;
            position: relative;
        }
        .nav-item.active {
            color: var(--text-primary);
        }
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 1px;
            background: var(--text-primary);
        }

        /* Post card */
        .post-card {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }

        /* Animaciones de entrada */
        .fade-in-up {
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }

        /* Botones laterales estilo Reels */
        .side-actions {
            position: absolute;
            right: 12px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 20;
        }

        .side-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .side-btn span {
            font-size: 12px;
            font-weight: 600;
        }

        /* Thumbnail */
        .video-thumbnail {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
            transition: opacity 0.3s;
        }

        .video-thumbnail.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .story-avatar {
                width: 48px;
                height: 48px;
            }
            .video-container {
                max-height: 65vh;
            }
            .side-actions {
                bottom: 60px;
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .heart, .fade-in-up {
                animation: none;
                opacity: 1;
            }
        }

        /* Indicador de muted */
        .muted-indicator {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.6);
            padding: 8px;
            border-radius: 50%;
            z-index: 15;
            cursor: pointer;
            transition: background 0.2s;
        }
        .muted-indicator:hover {
            background: rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="sticky top-0 z-50 bg-black border-b border-[#262626]">
        <div class="max-w-lg mx-auto px-4 py-3">
            <!-- Logo y titulo -->
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                        <rect x="2" y="2" width="28" height="28" rx="8" stroke="url(#grad1)" stroke-width="2"/>
                        <circle cx="16" cy="16" r="7" stroke="url(#grad1)" stroke-width="2"/>
                        <circle cx="24" cy="8" r="2" fill="url(#grad1)"/>
                        <defs>
                            <linearGradient id="grad1" x1="0" y1="0" x2="32" y2="32">
                                <stop offset="0%" stop-color="#f09433"/>
                                <stop offset="25%" stop-color="#e6683c"/>
                                <stop offset="50%" stop-color="#dc2743"/>
                                <stop offset="75%" stop-color="#cc2366"/>
                                <stop offset="100%" stop-color="#bc1888"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <span class="text-lg font-semibold">Instagram Educativo</span>
                </div>
                <div class="flex items-center gap-4">
                    <button class="relative" aria-label="Notificaciones">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                        <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-xs flex items-center justify-center">3</span>
                    </button>
                    <button aria-label="Mensajes">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Buscador destacado -->
            <div class="search-bar fade-in-up">
                <svg width="18" height="18" fill="none" stroke="#a8a8a8" stroke-width="2">
                    <circle cx="8" cy="8" r="7"/>
                    <path d="M14 14l4 4"/>
                </svg>
                <input type="text" value="¿Qué pasa en Urrá?" placeholder="Buscar" readonly>
            </div>
        </div>

        <!-- Navigation tabs -->
        <nav class="max-w-lg mx-auto px-4">
            <div class="flex justify-around">
                <button class="nav-item active" data-tab="posts">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    <span class="text-xs font-medium">Publicaciones</span>
                </button>
                <button class="nav-item" data-tab="reels">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="2" width="20" height="20" rx="5"/>
                        <polygon points="10,8 16,12 10,16" fill="currentColor"/>
                    </svg>
                    <span class="text-xs font-medium">Reels</span>
                </button>
                <button class="nav-item" data-tab="tagged">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <span class="text-xs font-medium">Etiquetados</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="max-w-lg mx-auto">
        <!-- Stories Section -->
        <section class="stories-container py-4 px-4 border-b border-[#262626]">
            <div class="flex gap-4" id="stories-list"></div>
        </section>

        <!-- Feed de Videos -->
        <section id="posts-feed" class="pb-20"></section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-black border-t border-[#262626] z-50">
        <div class="max-w-lg mx-auto flex justify-around py-2">
            <button class="p-3" aria-label="Inicio">
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                </svg>
            </button>
            <button class="p-3" aria-label="Buscar">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
            </button>
            <button class="p-3" aria-label="Crear">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="3"/>
                    <line x1="12" y1="8" x2="12" y2="16"/>
                    <line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
            </button>
            <button class="p-3" aria-label="Reels">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="2" width="20" height="20" rx="5"/>
                    <polygon points="10,8 16,12 10,16"/>
                </svg>
            </button>
            <button class="p-3" aria-label="Perfil">
                <div class="w-7 h-7 rounded-full bg-gradient-to-br from-purple-500 to-pink-500"></div>
            </button>
        </div>
    </nav>

    <script>
        // Datos de las cuentas
        const accounts = [
            { username: 'ChicNews', name: 'Proyecto Urrá', avatar: 'CN', gradient: 'from-emerald-500 to-teal-600', verified: true },
            { username: 'GRRE_98MF', name: 'GRRE', avatar: 'G', gradient: 'from-green-500 to-lime-500', verified: true },
            { username: 'Derechos_todos', name: 'Dignidad humana', avatar: 'D', gradient: 'from-blue-500 to-cyan-500', verified: false },
            { username: 'historia_viva', name: 'Historia Viva', avatar: 'Hv', gradient: 'from-amber-500 to-orange-500', verified: true },
            { username: 'Haxe666', name: 'Mi Cuenta Educativa', avatar: 'H', gradient: 'from-purple-500 to-pink-500', verified: false }
        ];

        // Estado de los posts con los videos ya cargados
        let posts = [
            {
                id: 1,
                account: accounts[0],
                videoId: 'LY5snY-sSug',
                description: 'Que esta pasando realmente en Urra y el rio Sinu? Aqui te lo explicamos sin rodeos. En las ultimas semanas, Cordoba ha vivido una de sus peores emergencias por inundaciones.',
                likes: 1247,
                liked: false,
                saved: false,
                comments: 89,
                shares: 34,
                isPlaying: false
            },
            {
                id: 2,
                account: accounts[1],
                videoId: 'V-IkAAtrXqg',
                description: 'Maquillate conmigo mientras te cuento como nos metieron los dedos en la boca con lo de las inundaciones de Urra... Al principio yo estaba en plan: pobrecitos, es el cambio climatico.',
                likes: 892,
                liked: false,
                saved: false,
                comments: 56,
                shares: 23,
                isPlaying: false
            },
            {
                id: 3,
                account: accounts[2],
                videoId: 'W12jz2ruU78',
                description: 'Detengamos un segundo el debate tecnico y hablemos de lo que realmente importa aqui: la dignidad de la gente. No mas comentarios sin corazon.',
                likes: 2103,
                liked: false,
                saved: false,
                comments: 134,
                shares: 67,
                isPlaying: false
            },
            {
                id: 4,
                account: accounts[3],
                videoId: 'ICzCYVF-cZg',
                description: 'Comunicado oficial: Medidas de mitigacion y compromisos en la Central Hidroelectrica URRA I. Frente a la contingencia ambiental y las lluvias atipicas.',
                likes: 567,
                liked: false,
                saved: false,
                comments: 42,
                shares: 18,
                isPlaying: false
            },
            {
                id: 5,
                account: accounts[4],
                videoId: 'brAR0sGxKjY',
                description: 'Como haremos realidad estos cambios? Pasamos de las palabras a la accion junto a las comunidades del Sinu. Activamos dos estrategias clave.',
                likes: 334,
                liked: false,
                saved: false,
                comments: 28,
                shares: 12,
                isPlaying: false
            }
        ];

        // Formatear números
        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        // Renderizar stories
        function renderStories() {
            const container = document.getElementById('stories-list');
            container.innerHTML = accounts.map((account, index) => `
                <div class="flex flex-col items-center gap-1 fade-in-up stagger-${index + 1}" style="cursor: pointer;">
                    <div class="story-ring">
                        <div class="story-ring-inner">
                            <div class="story-avatar flex items-center justify-center bg-gradient-to-br ${account.gradient} text-white font-bold text-lg">
                                ${account.avatar}
                            </div>
                        </div>
                    </div>
                    <span class="text-xs truncate w-14 text-center">${account.username.slice(0, 10)}</span>
                </div>
            `).join('');
        }

        // Crear corazones flotantes
        function createHearts(container, x, y) {
            const heartSymbols = ['❤️', '💗', '💖', '💕', '💝', '❤️‍🔥'];
            
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                    heart.style.left = (x + (Math.random() - 0.5) * 120) + 'px';
                    heart.style.top = (y + (Math.random() - 0.5) * 60) + 'px';
                    heart.style.fontSize = (35 + Math.random() * 35) + 'px';
                    container.appendChild(heart);
                    
                    setTimeout(() => heart.remove(), 1000);
                }, i * 60);
            }
        }

        // Toggle like
        function toggleLike(postId, button) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            
            post.liked = !post.liked;
            post.likes += post.liked ? 1 : -1;
            
            button.classList.toggle('liked', post.liked);
            
            // Actualizar todos los botones de like de este post
            document.querySelectorAll(`#post-${postId} .like-btn`).forEach(btn => {
                btn.classList.toggle('liked', post.liked);
                const svg = btn.querySelector('svg');
                if (svg) {
                    svg.setAttribute('fill', post.liked ? '#ed4956' : 'none');
                    svg.setAttribute('stroke', post.liked ? '#ed4956' : 'white');
                }
            });
            
            const likesSpan = document.querySelector(`#post-${postId} .likes-count`);
            if (likesSpan) {
                likesSpan.textContent = formatNumber(post.likes) + ' Me gusta';
            }
        }

        // Toggle save
        function toggleSave(postId, button) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            
            post.saved = !post.saved;
            button.classList.toggle('saved', post.saved);
            
            const svg = button.querySelector('svg');
            if (svg) {
                svg.setAttribute('fill', post.saved ? 'white' : 'none');
            }
        }

        // Toggle play/pause del video (simulado con overlay)
        function toggleVideo(postId, thumbnail, playBtn) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            
            post.isPlaying = !post.isPlaying;
            
            if (post.isPlaying) {
                thumbnail.classList.add('hidden');
                playBtn.style.display = 'none';
            } else {
                thumbnail.classList.remove('hidden');
                playBtn.style.display = 'flex';
            }
        }

        // Renderizar posts
        function renderPosts() {
            const container = document.getElementById('posts-feed');
            container.innerHTML = posts.map((post, index) => `
                <article id="post-${post.id}" class="post-card fade-in-up stagger-${index + 1}">
                    <!-- Header del post -->
                    <div class="flex items-center justify-between p-3">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-br ${post.account.gradient} flex items-center justify-center text-white font-bold text-sm">
                                ${post.account.avatar}
                            </div>
                            <div class="flex items-center gap-1">
                                <span class="font-semibold text-sm">${post.account.username}</span>
                                ${post.account.verified ? `
                                    <svg width="14" height="14" fill="#0095f6" viewBox="0 0 24 24">
                                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                    </svg>
                                ` : ''}
                            </div>
                        </div>
                        <button class="p-2 hover:bg-[#262626] rounded-full transition-colors" aria-label="Más opciones">
                            <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                                <circle cx="12" cy="5" r="2"/>
                                <circle cx="12" cy="12" r="2"/>
                                <circle cx="12" cy="19" r="2"/>
                            </svg>
                        </button>
                    </div>
                    
                    <!-- Video container estilo Reels -->
                    <div class="video-container mx-3" id="video-container-${post.id}">
                        <!-- Video embebido -->
                        <div class="video-wrapper">
                            <iframe 
                                src="https://www.youtube.com/embed/${post.videoId}?autoplay=0&controls=1&modestbranding=1&rel=0&showinfo=0&loop=1&playlist=${post.videoId}" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen
                                loading="lazy"
                            ></iframe>
                        </div>
                        
                        <!-- Thumbnail con play button -->
                        <img 
                            class="video-thumbnail" 
                            src="https://img.youtube.com/vi/${post.videoId}/maxresdefault.jpg"
                            alt="Video thumbnail"
                            id="thumbnail-${post.id}"
                            onerror="this.src='https://img.youtube.com/vi/${post.videoId}/hqdefault.jpg'"
                        >
                        
                        <!-- Play button -->
                        <div class="play-button" id="play-btn-${post.id}" onclick="toggleVideo(${post.id}, document.getElementById('thumbnail-${post.id}'), this)">
                            <svg viewBox="0 0 24 24">
                                <polygon points="5,3 19,12 5,21"/>
                            </svg>
                        </div>
                        
                        <!-- Overlay inferior para ocultar controles de YouTube -->
                        <div class="video-overlay-bottom"></div>
                        
                        <!-- Botones laterales estilo Reels -->
                        <div class="side-actions">
                            <div class="side-btn">
                                <button class="action-btn p-3 bg-black/40 rounded-full like-btn ${post.liked ? 'liked' : ''}" onclick="toggleLike(${post.id}, this)" aria-label="Me gusta">
                                    <svg width="28" height="28" fill="${post.liked ? '#ed4956' : 'none'}" stroke="${post.liked ? '#ed4956' : 'white'}" stroke-width="2">
                                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                                    </svg>
                                </button>
                                <span>${formatNumber(post.likes)}</span>
                            </div>
                            <div class="side-btn">
                                <button class="action-btn p-3 bg-black/40 rounded-full" aria-label="Comentar">
                                    <svg width="28" height="28" fill="none" stroke="white" stroke-width="2">
                                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                                    </svg>
                                </button>
                                <span>${post.comments}</span>
                            </div>
                            <div class="side-btn">
                                <button class="action-btn p-3 bg-black/40 rounded-full" aria-label="Compartir">
                                    <svg width="28" height="28" fill="none" stroke="white" stroke-width="2">
                                        <path d="M22 2L11 13"/>
                                        <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
                                    </svg>
                                </button>
                                <span>${post.shares}</span>
                            </div>
                            <div class="side-btn">
                                <button class="action-btn p-3 bg-black/40 rounded-full save-btn ${post.saved ? 'saved' : ''}" onclick="toggleSave(${post.id}, this)" aria-label="Guardar">
                                    <svg width="28" height="28" fill="${post.saved ? 'white' : 'none'}" stroke="white" stroke-width="2">
                                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        
                        <!-- Info del usuario en la parte inferior -->
                        <div class="absolute bottom-4 left-4 right-16 z-10">
                            <div class="flex items-center gap-2 mb-2">
                                <div class="w-7 h-7 rounded-full bg-gradient-to-br ${post.account.gradient} flex items-center justify-center text-white font-bold text-xs">
                                    ${post.account.avatar}
                                </div>
                                <span class="font-semibold text-sm text-white drop-shadow-lg">${post.account.username}</span>
                            </div>
                            <p class="text-white text-xs drop-shadow-lg line-clamp-2">${post.description.slice(0, 80)}...</p>
                        </div>
                    </div>
                    
                    <!-- Actions abajo -->
                    <div class="p-3">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-4">
                                <button class="action-btn like-btn ${post.liked ? 'liked' : ''}" onclick="toggleLike(${post.id}, this)" aria-label="Me gusta">
                                    <svg width="24" height="24" fill="${post.liked ? '#ed4956' : 'none'}" stroke="${post.liked ? '#ed4956' : 'currentColor'}" stroke-width="2">
                                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                                    </svg>
                                </button>
                                <button class="action-btn" aria-label="Comentar">
                                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                                    </svg>
                                </button>
                                <button class="action-btn" aria-label="Compartir">
                                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M22 2L11 13"/>
                                        <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
                                    </svg>
                                </button>
                            </div>
                            <button class="action-btn save-btn ${post.saved ? 'saved' : ''}" onclick="toggleSave(${post.id}, this)" aria-label="Guardar">
                                <svg width="24" height="24" fill="${post.saved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                                </svg>
                            </button>
                        </div>
                        <p class="font-semibold text-sm likes-count">${formatNumber(post.likes)} Me gusta</p>
                    </div>
                    
                    <!-- Description completa -->
                    <div class="px-3 pb-4">
                        <p class="text-sm">
                            <span class="font-semibold">${post.account.username}</span>
                            <span class="ml-1">${post.description}</span>
                        </p>
                        <p class="text-xs text-[#a8a8a8] mt-2">Ver los ${post.comments} comentarios</p>
                        <p class="text-xs text-[#a8a8a8] mt-1">Hace ${Math.floor(Math.random() * 24) + 1} horas</p>
                    </div>
                </article>
            `).join('');

            // Agregar event listeners para corazones en el área del video
            posts.forEach(post => {
                const container = document.getElementById(`video-container-${post.id}`);
                if (container) {
                    container.addEventListener('dblclick', (e) => {
                        // No crear corazones si es un botón
                        if (e.target.closest('button') || e.target.closest('.play-button')) return;
                        
                        const rect = container.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;
                        
                        createHearts(container, x, y);
                        
                        // También dar like
                        if (!post.liked) {
                            toggleLike(post.id, document.querySelector(`#post-${post.id} .side-btn .like-btn`));
                        }
                    });
                }
            });
        }

        // Navigation tabs
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            });
        });

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            renderStories();
            renderPosts();
        });
    </script>
</body>
</html>
