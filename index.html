<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Educativo - ¿Qué pasa en Urrá?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #121212;
            --bg-card: #1a1a1a;
            --text-primary: #fafafa;
            --text-secondary: #a8a8a8;
            --accent-blue: #0095f6;
            --accent-red: #ed4956;
            --border-color: #262626;
            --story-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        * {
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Scrollbar personalizado */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: #363636;
            border-radius: 10px;
        }

        /* Stories */
        .story-ring {
            background: var(--story-gradient);
            padding: 3px;
            border-radius: 50%;
        }

        .story-ring-inner {
            background: var(--bg-primary);
            padding: 2px;
            border-radius: 50%;
        }

        .story-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
        }

        .stories-container {
            overflow-x: auto;
            scrollbar-width: none;
        }
        .stories-container::-webkit-scrollbar {
            display: none;
        }

        /* Video container */
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 9/16;
            max-height: 70vh;
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Corazones animados */
        .heart {
            position: absolute;
            pointer-events: none;
            animation: floatHeart 1s ease-out forwards;
            font-size: 60px;
            z-index: 100;
        }

        @keyframes floatHeart {
            0% {
                opacity: 1;
                transform: scale(0) rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: scale(1.2) rotate(-10deg);
            }
            100% {
                opacity: 0;
                transform: scale(1) translateY(-150px) rotate(10deg);
            }
        }

        /* Botones de acción */
        .action-btn {
            transition: transform 0.2s ease;
        }
        .action-btn:active {
            transform: scale(0.85);
        }

        .action-btn.liked svg {
            fill: var(--accent-red);
            color: var(--accent-red);
            animation: likePopup 0.4s ease;
        }

        @keyframes likePopup {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Input de enlace */
        .link-input {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 8px;
            width: 100%;
            font-size: 12px;
            transition: border-color 0.2s;
        }
        .link-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        .link-input::placeholder {
            color: var(--text-secondary);
        }

        /* Descripción editable */
        .editable-description {
            background: transparent;
            border: 1px dashed transparent;
            padding: 4px 8px;
            border-radius: 4px;
            color: var(--text-primary);
            width: 100%;
            min-height: 60px;
            resize: none;
            transition: border-color 0.2s;
        }
        .editable-description:hover {
            border-color: var(--border-color);
        }
        .editable-description:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: var(--bg-secondary);
        }

        /* Buscador */
        .search-bar {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-bar:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(0, 149, 246, 0.1);
        }
        .search-bar input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            flex: 1;
            font-size: 14px;
        }
        .search-bar input:focus {
            outline: none;
        }

        /* Navigation */
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 12px 0;
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.2s;
            position: relative;
        }
        .nav-item.active {
            color: var(--text-primary);
        }
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 1px;
            background: var(--text-primary);
        }

        /* Post card */
        .post-card {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }

        /* Follow button */
        .follow-btn {
            background: var(--accent-blue);
            color: white;
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            transition: opacity 0.2s;
        }
        .follow-btn:hover {
            opacity: 0.85;
        }
        .follow-btn.following {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }

        /* Animaciones de entrada */
        .fade-in-up {
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }

        /* Responsive */
        @media (max-width: 640px) {
            .story-avatar {
                width: 48px;
                height: 48px;
            }
            .video-container {
                max-height: 60vh;
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .heart, .fade-in-up {
                animation: none;
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="sticky top-0 z-50 bg-black border-b border-[#262626]">
        <div class="max-w-lg mx-auto px-4 py-3">
            <!-- Logo y titulo -->
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                        <rect x="2" y="2" width="28" height="28" rx="8" stroke="url(#grad1)" stroke-width="2"/>
                        <circle cx="16" cy="16" r="7" stroke="url(#grad1)" stroke-width="2"/>
                        <circle cx="24" cy="8" r="2" fill="url(#grad1)"/>
                        <defs>
                            <linearGradient id="grad1" x1="0" y1="0" x2="32" y2="32">
                                <stop offset="0%" stop-color="#f09433"/>
                                <stop offset="25%" stop-color="#e6683c"/>
                                <stop offset="50%" stop-color="#dc2743"/>
                                <stop offset="75%" stop-color="#cc2366"/>
                                <stop offset="100%" stop-color="#bc1888"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <span class="text-lg font-semibold">Instagram Educativo</span>
                </div>
                <div class="flex items-center gap-4">
                    <button class="relative" aria-label="Notificaciones">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                        <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-xs flex items-center justify-center">3</span>
                    </button>
                    <button aria-label="Mensajes">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Buscador destacado -->
            <div class="search-bar fade-in-up">
                <svg width="18" height="18" fill="none" stroke="#a8a8a8" stroke-width="2">
                    <circle cx="8" cy="8" r="7"/>
                    <path d="M14 14l4 4"/>
                </svg>
                <input type="text" value="¿Qué pasa en Urrá?" placeholder="Buscar" readonly>
            </div>
        </div>

        <!-- Navigation tabs -->
        <nav class="max-w-lg mx-auto px-4">
            <div class="flex justify-around">
                <button class="nav-item active" data-tab="posts">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    <span class="text-xs font-medium">Publicaciones</span>
                </button>
                <button class="nav-item" data-tab="reels">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="2" width="20" height="20" rx="5"/>
                        <polygon points="10,8 16,12 10,16" fill="currentColor"/>
                    </svg>
                    <span class="text-xs font-medium">Reels</span>
                </button>
                <button class="nav-item" data-tab="tagged">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <circle cx="12" cy="12" r="3"/>
                        <line x1="12" y1="2" x2="12" y2="4"/>
                        <line x1="12" y1="20" x2="12" y2="22"/>
                        <line x1="2" y1="12" x2="4" y2="12"/>
                        <line x1="20" y1="12" x2="22" y2="12"/>
                    </svg>
                    <span class="text-xs font-medium">Etiquetados</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="max-w-lg mx-auto">
        <!-- Stories Section -->
        <section class="stories-container py-4 px-4 border-b border-[#262626]">
            <div class="flex gap-4" id="stories-list">
                <!-- Stories se generan con JS -->
            </div>
        </section>

        <!-- Feed de Videos -->
        <section id="posts-feed" class="pb-20">
            <!-- Posts se generan con JS -->
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-black border-t border-[#262626] z-50">
        <div class="max-w-lg mx-auto flex justify-around py-2">
            <button class="p-3" aria-label="Inicio">
                <svg width="24" height="24" fill="currentColor" stroke="currentColor" stroke-width="0">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                </svg>
            </button>
            <button class="p-3" aria-label="Buscar">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
            </button>
            <button class="p-3" aria-label="Crear">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="3"/>
                    <line x1="12" y1="8" x2="12" y2="16"/>
                    <line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
            </button>
            <button class="p-3" aria-label="Reels">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="2" width="20" height="20" rx="5"/>
                    <polygon points="10,8 16,12 10,16"/>
                </svg>
            </button>
            <button class="p-3" aria-label="Perfil">
                <div class="w-7 h-7 rounded-full bg-gradient-to-br from-purple-500 to-pink-500"></div>
            </button>
        </div>
    </nav>

    <!-- Modal para configurar video -->
    <div class="modal-overlay" id="config-modal">
        <div class="bg-[#1a1a1a] rounded-2xl p-6 max-w-sm w-full mx-4">
            <h3 class="text-lg font-semibold mb-4">Configurar Video</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-sm text-gray-400 mb-2 block">Enlace de YouTube Short</label>
                    <input type="text" class="link-input" id="video-link-input" placeholder="https://youtube.com/shorts/LY5snY-sSug?feature=share">
                </div>
                <div>
                    <label class="text-sm text-gray-400 mb-2 block">Descripción</label>
                    <textarea class="editable-description w-full" id="video-desc-input" rows="3" placeholder="Escribe la descripción..."></textarea>
                </div>
                <div class="flex gap-3 mt-6">
                    <button class="flex-1 py-2 rounded-lg bg-[#363636] font-medium" onclick="closeModal()">Cancelar</button>
                    <button class="flex-1 py-2 rounded-lg bg-[#0095f6] font-medium" onclick="saveVideoConfig()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Datos de las cuentas
        const accounts = [
            { username: 'ChicNews', name: 'Proyecto Urrá', avatar: 'CN', gradient: 'from-emerald-500 to-teal-600', verified: true },
            { username: 'GRRE_98MF', name: 'GRRE', avatar: 'G', gradient: 'from-green-500 to-lime-500', verified: true },
            { username: 'Derechos_todos', name: 'Dignidad humana', avatar: 'D', gradient: 'from-blue-500 to-cyan-500', verified: false },
            { username: 'historia_viva', name: 'Historia Viva', avatar: 'Hv', gradient: 'from-amber-500 to-orange-500', verified: true },
            { username: 'Haxe666', name: 'Mi Cuenta Educativa', avatar: 'H', gradient: 'from-purple-500 to-pink-500', verified: false }
        ];

        // Estado de los posts
        let posts = [
            {
                id: 1,
                account: accounts[0],
                videoId: '',
                videoUrl: 'https://youtube.com/shorts/LY5snY-sSug?feature=share',
                description: '🚨 ¿Qué está pasando realmente en Urrá y el río Sinú? Aquí te lo explicamos sin rodeos. En las últimas semanas, Córdoba ha vivido una de sus peores emergencias por inundaciones, dejando a miles de familias damnificadas en Tierralta, Montería, Lorica y otros municipios. Pero, ¿de quién es la culpa?           Leer más',
                likes: 1247,
                liked: false,
                saved: false,
                comments: 89,
                shares: 34
            },
            {
                id: 2,
                account: accounts[1],
                videoId: '',
                videoUrl: 'https://youtube.com/shorts/V-IkAAtrXqg?feature=share',
                description: '💄 Maquíllate conmigo mientras te cuento cómo nos metieron los dedos en la boca con lo de las inundaciones de Urrá... 🤯👇                     Al principio yo estaba en plan: "Ay, pobrecitos, es que el cambio climático y las lluvias atípicas no dan tregua". Pero me puse a investigar, a leer informes y      Leer más',
                likes: 892,
                liked: false,
                saved: false,
                comments: 56,
                shares: 23
            },
            {
                id: 3,
                account: accounts[2],
                videoId: '',
                videoUrl: 'https://youtube.com/shorts/W12jz2ruU78?feature=share',
                description: 'Detengamos un segundo el debate técnico y hablemos de lo que realmente importa aquí: la dignidad de la gente. 🛑👇 He estado leyendo comentarios en redes que me dejan fría. Gente diciendo que "eso les pasa por vivir cerca del río", que "es culpa de la naturaleza y ya" o que "solo buscan que el gobierno les regale todo". ¡No más! Desmintamos esto de una vez.      Leer más',
                likes: 2103,
                liked: false,
                saved: false,
                comments: 134,
                shares: 67
            },
            {
                id: 4,
                account: accounts[3],
                videoId: '',
                videoUrl: 'https://youtube.com/shorts/ICzCYVF-cZg?feature=share',
                description: '📢 Comunicado oficial: Medidas de mitigación y compromisos en la Central Hidroeléctrica URRÁ I. 👇      Frente a la contingencia ambiental y las lluvias atípicas e históricas que han afectado al departamento de Córdoba, desde la Empresa URRÁ S.A. E.S.P. ratificamos nuestro compromiso con la protección y bienestar de las comunidades de la cuenca del río Sinú.      Leer más',
                likes: 567,
                liked: false,
                saved: false,
                comments: 42,
                shares: 18
            },
            {
                id: 5,
                account: accounts[4],
                videoId: '',
                videoUrl: 'https://youtube.com/shorts/brAR0sGxKjY?feature=share',
                description: '🛠️ ¿Cómo haremos realidad estos cambios? Pasamos de las palabras a la acción junto a las comunidades del Sinú. 👇 Entendemos que la prevención no se hace desde un escritorio, sino en el territorio. Por eso, para que las inundaciones no nos vuelvan a tomar por sorpresa, activamos dos estrategias clave',
                likes: 334,
                liked: false,
                saved: false,
                comments: 28,
                shares: 12
            }
        ];

        let currentEditingPost = null;

        // Extraer ID de video de YouTube
        function extractYouTubeId(url) {
            if (!url) return '';
            const patterns = [
                /(?:youtube\.com\/shorts\/)([a-zA-Z0-9_-]+)/,
                /(?:youtu\.be\/)([a-zA-Z0-9_-]+)/,
                /(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]+)/,
                /(?:youtube\.com\/watch\?v=)([a-zA-Z0-9_-]+)/
            ];
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }
            return '';
        }

        // Formatear números
        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        // Renderizar stories
        function renderStories() {
            const container = document.getElementById('stories-list');
            container.innerHTML = accounts.map((account, index) => `
                <div class="flex flex-col items-center gap-1 fade-in-up stagger-${index + 1}" style="cursor: pointer;">
                    <div class="story-ring">
                        <div class="story-ring-inner">
                            <div class="story-avatar flex items-center justify-center bg-gradient-to-br ${account.gradient} text-white font-bold text-lg">
                                ${account.avatar}
                            </div>
                        </div>
                    </div>
                    <span class="text-xs truncate w-14 text-center">${account.username.slice(0, 10)}</span>
                </div>
            `).join('');
        }

        // Crear corazones flotantes
        function createHearts(container, x, y) {
            const colors = ['#ed4956', '#ff6b6b', '#ff8787', '#fa5252', '#e03131'];
            const heartSymbols = ['❤️', '💗', '💖', '💕', '💝'];
            
            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                    heart.style.left = (x + (Math.random() - 0.5) * 100) + 'px';
                    heart.style.top = (y + (Math.random() - 0.5) * 50) + 'px';
                    heart.style.fontSize = (40 + Math.random() * 30) + 'px';
                    container.appendChild(heart);
                    
                    setTimeout(() => heart.remove(), 1000);
                }, i * 80);
            }
        }

        // Toggle like
        function toggleLike(postId, button) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            
            post.liked = !post.liked;
            post.likes += post.liked ? 1 : -1;
            
            button.classList.toggle('liked', post.liked);
            const likesSpan = document.querySelector(`#post-${postId} .likes-count`);
            if (likesSpan) {
                likesSpan.textContent = formatNumber(post.likes) + ' Me gusta';
            }
        }

        // Toggle save
        function toggleSave(postId, button) {
            button.classList.toggle('saved');
            const isSaved = button.classList.contains('saved');
            button.innerHTML = isSaved ? `
                <svg width="24" height="24" fill="currentColor" stroke="currentColor" stroke-width="0">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                </svg>
            ` : `
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                </svg>
            `;
        }

        // Abrir modal de configuración
        function openConfigModal(postId) {
            currentEditingPost = postId;
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            
            document.getElementById('video-link-input').value = post.videoUrl || '';
            document.getElementById('video-desc-input').value = post.description || '';
            document.getElementById('config-modal').classList.add('active');
        }

        // Cerrar modal
        function closeModal() {
            document.getElementById('config-modal').classList.remove('active');
            currentEditingPost = null;
        }

        // Guardar configuración de video
        function saveVideoConfig() {
            if (!currentEditingPost) return;
            
            const post = posts.find(p => p.id === currentEditingPost);
            if (!post) return;
            
            const url = document.getElementById('video-link-input').value;
            const desc = document.getElementById('video-desc-input').value;
            
            post.videoUrl = url;
            post.videoId = extractYouTubeId(url);
            post.description = desc;
            
            renderPosts();
            closeModal();
        }

        // Renderizar posts
        function renderPosts() {
            const container = document.getElementById('posts-feed');
            container.innerHTML = posts.map((post, index) => `
                <article id="post-${post.id}" class="post-card fade-in-up stagger-${index + 1}">
                    <!-- Header del post -->
                    <div class="flex items-center justify-between p-3">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-br ${post.account.gradient} flex items-center justify-center text-white font-bold text-sm">
                                ${post.account.avatar}
                            </div>
                            <div class="flex items-center gap-1">
                                <span class="font-semibold text-sm">${post.account.username}</span>
                                ${post.account.verified ? `
                                    <svg width="14" height="14" fill="#0095f6" viewBox="0 0 24 24">
                                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                    </svg>
                                ` : ''}
                            </div>
                        </div>
                        <button onclick="openConfigModal(${post.id})" class="p-2 hover:bg-[#262626] rounded-full transition-colors" title="Configurar video">
                            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="3"/>
                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                            </svg>
                        </button>
                    </div>
                    
                    <!-- Video container -->
                    <div class="video-container mx-3" id="video-container-${post.id}">
                        ${post.videoId ? `
                            <iframe 
                                src="https://www.youtube.com/embed/${post.videoId}" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen
                            ></iframe>
                        ` : `
                            <div class="w-full h-full flex flex-col items-center justify-center text-center p-4 bg-[#1a1a1a]">
                                <svg width="48" height="48" fill="none" stroke="#363636" stroke-width="1.5">
                                    <rect x="2" y="2" width="20" height="20" rx="5"/>
                                    <polygon points="10,8 16,12 10,16" fill="#363636"/>
                                </svg>
                                <p class="text-[#a8a8a8] text-sm mt-3">Click en el engranaje arriba para agregar tu video de YouTube Shorts</p>
                            </div>
                        `}
                        <div class="absolute bottom-4 right-4 flex flex-col gap-3">
                            <button class="action-btn p-2 bg-black/50 rounded-full ${post.liked ? 'liked' : ''}" onclick="toggleLike(${post.id}, this)" aria-label="Me gusta">
                                <svg width="28" height="28" fill="${post.liked ? '#ed4956' : 'none'}" stroke="${post.liked ? '#ed4956' : 'white'}" stroke-width="2">
                                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                                </svg>
                            </button>
                            <button class="action-btn p-2 bg-black/50 rounded-full" aria-label="Comentar">
                                <svg width="28" height="28" fill="none" stroke="white" stroke-width="2">
                                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                                </svg>
                            </button>
                            <button class="action-btn p-2 bg-black/50 rounded-full" aria-label="Compartir">
                                <svg width="28" height="28" fill="none" stroke="white" stroke-width="2">
                                    <path d="M22 2L11 13"/>
                                    <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
                                </svg>
                            </button>
                            <button class="action-btn p-2 bg-black/50 rounded-full ${post.saved ? 'saved' : ''}" onclick="toggleSave(${post.id}, this)" aria-label="Guardar">
                                ${post.saved ? `
                                    <svg width="28" height="28" fill="white" stroke="white" stroke-width="0">
                                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                                    </svg>
                                ` : `
                                    <svg width="28" height="28" fill="none" stroke="white" stroke-width="2">
                                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                                    </svg>
                                `}
                            </button>
                        </div>
                    </div>
                    
                    <!-- Actions -->
                    <div class="p-3">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-4">
                                <button class="action-btn ${post.liked ? 'liked' : ''}" onclick="toggleLike(${post.id}, this)" aria-label="Me gusta">
                                    <svg width="24" height="24" fill="${post.liked ? '#ed4956' : 'none'}" stroke="${post.liked ? '#ed4956' : 'currentColor'}" stroke-width="2">
                                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                                    </svg>
                                </button>
                                <button class="action-btn" aria-label="Comentar">
                                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                                    </svg>
                                </button>
                                <button class="action-btn" aria-label="Compartir">
                                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M22 2L11 13"/>
                                        <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
                                    </svg>
                                </button>
                            </div>
                            <button class="action-btn ${post.saved ? 'saved' : ''}" onclick="toggleSave(${post.id}, this)" aria-label="Guardar">
                                ${post.saved ? `
                                    <svg width="24" height="24" fill="currentColor" stroke="currentColor" stroke-width="0">
                                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                                    </svg>
                                ` : `
                                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                                    </svg>
                                `}
                            </button>
                        </div>
                        <p class="font-semibold text-sm likes-count">${formatNumber(post.likes)} Me gusta</p>
                    </div>
                    
                    <!-- Description -->
                    <div class="px-3 pb-4">
                        <p class="text-sm">
                            <span class="font-semibold">${post.account.username}</span>
                            <span class="ml-1">${post.description}</span>
                        </p>
                        <p class="text-xs text-[#a8a8a8] mt-2">Ver los ${post.comments} comentarios</p>
                        <p class="text-xs text-[#a8a8a8] mt-1">Hace ${Math.floor(Math.random() * 24) + 1} horas</p>
                    </div>
                </article>
            `).join('');

            // Agregar event listeners para corazones
            posts.forEach(post => {
                const container = document.getElementById(`video-container-${post.id}`);
                if (container) {
                    container.addEventListener('click', (e) => {
                        // Solo si no es un botón
                        if (e.target.closest('button')) return;
                        
                        const rect = container.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;
                        
                        createHearts(container, x, y);
                        
                        // También dar like
                        if (!post.liked) {
                            const likeBtn = container.querySelector('.action-btn');
                            if (likeBtn) toggleLike(post.id, likeBtn);
                        }
                    });
                }
            });
        }

        // Navigation tabs
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            });
        });

        // Cerrar modal con ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Cerrar modal al hacer clic fuera
        document.getElementById('config-modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            renderStories();
            renderPosts();
        });
    </script>
</body>
</html>
